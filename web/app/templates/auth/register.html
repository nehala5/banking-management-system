{% extends "base.html" %}
{% block title %}Open an account — OneSky Bank{% endblock %}

{% block content %}
<section class="auth-shell">
  <div class="auth-card" style="max-width: 480px">
    <h1>Open your account</h1>
    <p class="sub">Takes a minute. A savings account is created for you automatically.</p>

    <form class="form-grid" method="post" action="{{ url_for('main.register') }}">
      <div class="form-row">
        <label for="name">Full name</label>
        <input id="name" name="name" value="{{ form.name }}" placeholder="Your full name" required>
      </div>
      <div class="form-row">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" value="{{ form.email }}" placeholder="you@example.com" required>
      </div>
      <div class="form-row">
        <label for="phone">Phone <span class="req">*</span></label>
        <input id="phone" name="phone" inputmode="numeric" value="{{ form.phone }}" class="mono" placeholder="10 digits, no spaces" required>
      </div>
      <div class="form-row">
        <label for="address">Address</label>
        <textarea id="address" name="address" rows="2" placeholder="Street, city">{{ form.address }}</textarea>
      </div>
      <div class="form-grid" style="grid-template-columns: 1fr 1fr; gap: 12px">
        <div class="form-row">
          <label for="pin">Choose a 4-digit PIN</label>
          <input id="pin" name="pin" type="password" inputmode="numeric" maxlength="4" class="mono" required>
        </div>
        <div class="form-row">
          <label for="pin_confirm">Confirm PIN</label>
          <input id="pin_confirm" name="pin_confirm" type="password" inputmode="numeric" maxlength="4" class="mono" required>
        </div>
      </div>
      <button class="btn btn-primary btn-lg" type="submit">Create my account</button>
    </form>

    <p class="hint center" style="margin-top:14px">
      Already registered? <a href="{{ url_for('main.login') }}">Sign in</a> instead.
    </p>
  </div>
</section>
{% endblock %}
